name: VigilCode compiler
on:
  push:
  pull_request:
jobs:
  compiler:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m vigilcode build examples/stewardship.vigil -O -o build/stewardship
      - run: ./build/stewardship
