name: VigilCode compiler
on:
  push:
  pull_request:
jobs:
  compiler:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, arch: x64}
          - {os: ubuntu-24.04-arm, arch: arm64}
          - {os: macos-latest, arch: arm64}
          - {os: macos-15-intel, arch: x64}
          # Windows has never been run by the maintainers; failures here are informational until it has.
          - {os: windows-latest, arch: x64, windows: true}
          - {os: windows-11-arm, arch: arm64, windows: true}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.windows == true }}
    env:
      CC: ${{ matrix.windows && 'clang' || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-output.txt
      - name: Report failing tests as annotations (readable without signing in)
        if: failure()
        shell: bash
        run: python .github/annotate_failures.py test-output.txt
      - run: python -m vigilcode build examples/stewardship.vigil -O -o build/stewardship
      - run: ./build/stewardship
        shell: bash
      - name: Package, install the wheel in a clean environment, and run it
        shell: bash
        run: |
          python -m pip install build
          python -m build --outdir dist .
          python -m venv "$RUNNER_TEMP/clean-env"
          "$RUNNER_TEMP"/clean-env/*/pip install dist/*.whl
          "$RUNNER_TEMP"/clean-env/*/vigil run examples/ledger.vigil
          "$RUNNER_TEMP"/clean-env/*/vigil test examples/tally/test_words.vigil
      - name: Per-user install script (Linux)
        if: runner.os == 'Linux'
        run: |
          sh scripts/install-linux.sh
          ~/.local/bin/vigil run "$HOME/VigilCode Projects/hello.vigil"
          test -f ~/.local/share/applications/vigilcode-workbench.desktop
          sh scripts/uninstall-linux.sh
      - name: Per-user install script (macOS)
        if: runner.os == 'macOS'
        run: |
          sh scripts/install-macos.sh
          ~/.local/bin/vigil run "$HOME/VigilCode Projects/hello.vigil"
          test -x "$HOME/Applications/VigilCode Workbench.app/Contents/MacOS/workbench"
          sh scripts/uninstall-macos.sh
      - name: Per-user install script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install-windows.ps1
          & "$env:LOCALAPPDATA\VigilCode\bin\vigil.cmd" run "$env:USERPROFILE\VigilCode Projects\hello.vigil"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./scripts/uninstall-windows.ps1
