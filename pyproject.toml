[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vigilcode"
version = "0.2.0"
description = "An original, Christian and Catholic-inspired native programming language"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "vigilcode/fonts/OFL.txt"]
authors = [{name = "VigilTech"}]

[project.scripts]
vigil = "vigilcode.cli:main"
vigilcode = "vigilcode.cli:main"

[tool.setuptools.package-data]
vigilcode = ["runtime.h", "workbench.html", "fonts/*"]
